name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  storage-conformance:
    name: Storage conformance against real Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Supabase and Neon share one SQL engine, so exercising it against a genuine
    # Postgres verifies most of both without needing an account for either.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run the conformance suite
        run: npm run test
        env:
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/opb_test

  content-safety:
    name: No personal or client-owned content
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a file deleted in a later commit is still in the pack,
          # and a public repo hands out the whole pack.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Check working tree
        run: node scripts/check-no-personal-data.mjs

      # The binary rather than the marketplace action: that action requires a
      # licence key for organisation-owned repositories and wants API
      # permissions this workflow deliberately does not grant. Same scan,
      # nothing to configure, and it behaves identically in a fork.
      - name: Scan for committed secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz             | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1
