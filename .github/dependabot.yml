version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Grouped so a normal week is one reviewable PR rather than fifteen.
    groups:
      dev-tooling:
        patterns:
          - eslint*
          - '@eslint/*'
          - typescript-eslint
          - prettier
          - vite
          - '@vitejs/*'
          - typescript
      react:
        patterns:
          - react
          - react-dom
          - '@types/react*'
      production:
        dependency-type: production

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
